name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install optional system dependencies (OCR engine)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr fonts-dejavu-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pillow reportlab arabic_reshaper python-bidi
          pip install numpy opencv-python-headless pytesseract openpyxl

      - name: Lint Windows batch scripts
        run: python tools/lint_bat.py

      - name: Run tests
        run: python -m pytest tests/ -q

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sarrafi
          POSTGRES_PASSWORD: sarrafi
          POSTGRES_DB: sarrafi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sarrafi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional system dependencies (OCR engine)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr fonts-dejavu-core
      - name: Install dependencies
        run: |
          pip install pytest pillow psycopg2-binary reportlab
          pip install arabic_reshaper python-bidi numpy opencv-python-headless
      - name: Run integration tests on PostgreSQL
        env:
          SARRAFI_DATABASE_URL: postgresql://sarrafi:sarrafi@127.0.0.1:5432/sarrafi
        run: python -m pytest tests/ -q
